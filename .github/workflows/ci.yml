name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude irosh-fuzz --all-features -- -D warnings

  clippy-fix:
    name: Clippy (auto-fix check)
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude irosh-fuzz --all-features --all-targets --fix --allow-dirty -- -D warnings 2>&1 || true
      - name: Check for uncommitted clippy fixes
        run: |
          if ! git diff --exit-code; then
            echo "::error::clippy --fix produced changes — run 'cargo clippy --fix' locally and commit"
            exit 1
          fi

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude irosh-fuzz --all-features

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude irosh-fuzz --all-features

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude irosh-fuzz --all-features

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude irosh-fuzz --all-features --release

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  miri:
    name: MIRI (UB detection)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test --lib --all-features -- --test-threads 2 --skip server::tests

  output-consistency:
    name: Output consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ban raw print calls in command and main code
        run: |
          if grep -rn 'println!(' cli/src/commands/ cli/src/main.rs || grep -rn 'eprintln!(' cli/src/commands/ cli/src/main.rs; then
            echo "::error::Raw println!/eprintln! call found in cli/src/commands/ or cli/src/main.rs — use Output::* for stdout data or Ui::* for stderr messages"
            exit 1
          fi
      - name: Ban inline tip strings in command code
        run: |
          if grep -rn 'Ui::error(' cli/src/commands/ | grep 'Some("' ; then
            echo "::error::Inline tip string found in cli/src/commands/ — all tips must reference messages::* constants"
            exit 1
          fi

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Fuzz ticket parser
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_ticket -- -max_total_time=30
      - name: Fuzz IPC deserialization
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_ipc -- -max_total_time=30
      - name: Fuzz transfer frame codec
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_transfer_frame -- -max_total_time=30
      - name: Fuzz metadata codec
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_metadata -- -max_total_time=30

  features:
    name: Feature flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude irosh-fuzz --all-features

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --exclude irosh-fuzz --all-features --lcov --output-path lcov.info --fail-under-lines 50
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
