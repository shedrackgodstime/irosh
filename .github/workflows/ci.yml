name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude irosh-fuzz --all-features -- -D warnings

  clippy-fix:
    name: Clippy (auto-fix check)
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude irosh-fuzz --all-features --all-targets --fix --allow-dirty -- -D warnings 2>&1 || true
      - name: Check for uncommitted clippy fixes
        run: |
          if ! git diff --exit-code; then
            echo "::error::clippy --fix produced changes — run 'cargo clippy --fix' locally and commit"
            exit 1
          fi

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude irosh-fuzz --all-features

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude irosh-fuzz --all-features

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Repeat PTY teardown regression
        timeout-minutes: 15
        run: |
          failed=0
          for attempt in {1..20}; do
            echo "PTY teardown attempt $attempt/20"
            cargo test -p irosh --all-features --lib connection_teardown_reaps_live_shell_process -- --nocapture || failed=1
          done
          exit "$failed"
      - run: cargo test --workspace --exclude irosh-fuzz --all-features
        if: ${{ !cancelled() }}

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --exclude irosh-fuzz --all-features --release

  release-builds:
    name: Release build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: aarch64-unknown-linux-musl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build (release)
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked --workspace --exclude irosh-fuzz --target ${{ matrix.target }}

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  miri:
    name: MIRI (UB detection)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: MIRI unix socket path logic
        run: cargo miri test --lib --all-features server::ipc::unix_tests
      - name: MIRI error formatting
        run: cargo miri test --lib --all-features error::tests
      - name: MIRI stream codec
        run: cargo miri test --lib --all-features transport::stream::tests

  output-consistency:
    name: Output consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ban raw print calls in command and main code
        run: |
          if grep -rn 'println!(' cli/src/commands/ cli/src/main.rs || grep -rn 'eprintln!(' cli/src/commands/ cli/src/main.rs; then
            echo "::error::Raw println!/eprintln! call found in cli/src/commands/ or cli/src/main.rs — use Output::* for stdout data or Ui::* for stderr messages"
            exit 1
          fi
      - name: Ban inline tip strings in command code
        run: |
          if grep -rn 'Ui::error(' cli/src/commands/ | grep 'Some("' ; then
            echo "::error::Inline tip string found in cli/src/commands/ — all tips must reference messages::* constants"
            exit 1
          fi

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz ticket parser
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_ticket -- -max_total_time=30
      - name: Fuzz IPC deserialization
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_ipc -- -max_total_time=30
      - name: Fuzz transfer frame codec
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_transfer_frame -- -max_total_time=30
      - name: Fuzz metadata codec
        run: cargo fuzz run --target x86_64-unknown-linux-gnu fuzz_metadata -- -max_total_time=30

  features:
    name: Feature flags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude irosh-fuzz --all-features

  coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --exclude irosh-fuzz --all-features --lcov --output-path lcov.info --fail-under-lines 50
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
