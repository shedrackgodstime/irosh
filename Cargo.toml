[workspace]
members = ["cli", "fuzz"]
resolver = "2"


[package]
name = "irosh"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
authors = ["Shedrack Godstime <shedrackgodstime@gmail.com>"]
description = "Secure P2P SSH and data transfer protocol. Connect to any machine without an IP address, open ports, or VPNs."
readme = "src/README.md"
repository = "https://github.com/shedrackgodstime/irosh"
license = "MIT OR Apache-2.0"
keywords = ["ssh", "p2p", "iroh", "nat-traversal", "quic"]
categories = ["network-programming", "asynchronous"]
exclude = [
    "cli/",
    "scratch/",
    "public/",
    ".github/",
    "docs/",
]

[features]
default   = ["server", "client"]
server    = ["transport", "storage", "dep:russh", "dep:portable-pty", "dep:chrono"]
client    = ["transport", "storage", "dep:russh"]
storage   = ["dep:serde", "dep:serde_json"]
transport = ["dep:iroh", "dep:iroh-gossip", "dep:iroh-tickets", "dep:iroh-blobs"]
console = ["dep:console"]

[dependencies]
iroh = { version = "1.0.3", optional = true }
iroh-gossip = { version = "0.101.0", optional = true, features = ["net"] }
iroh-blobs = { version = "0.103.0", optional = true }
iroh-tickets = { version = "1.0.0", optional = true }
futures-util = { version = "0.3.33", default-features = false, features = ["alloc"] }
pkarr = "7.0.0"
portable-pty = { version = "0.9.0", optional = true }
russh = { version = "0.62.4", optional = true, default-features = false, features = ["ring"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
async-trait = "0.1.91"
thiserror = "2.0.19"
tracing = "0.1.44"
secrecy = "0.10.3"
tokio = { version = "1.53.1", features = ["io-util", "sync", "macros", "process", "net", "fs", "signal", "rt"] }
tokio-util = { version = "0.7.19" }
dirs = "6.0.0"
rand = "0.10.2"
hex = "0.4.3"
sha2 = "0.11.0"
walkdir = "2.5.0"
argon2 = "0.6.0-rc.8"
console = { version = "0.16.4", optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Console",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
] }
windows-service = "0.8.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winreg = "0.56.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tempfile = "3.27.0"
proptest = "1.11.0"
criterion = { version = "0.8.2", features = ["async_tokio"] }

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = false
panic = "abort"
strip = true